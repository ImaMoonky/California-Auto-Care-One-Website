<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>California Auto Care One</title>
    <script>
      // Redirect GitHub Pages 404 to app root
      var pathSegments = location.pathname.split('/');
      // If deployed in a subfolder (/repo-name/), keep repo name
      var repoBase = pathSegments.length > 2 && pathSegments[1] ? '/' + pathSegments[1] + '/' : '/';
      location.replace(repoBase);
    </script>
    <meta http-equiv="refresh" content="0; URL='./'" />
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>Redirecting to California Auto Care One...</h2>
    <p><a href="./">Click here if you are not redirected automatically</a></p>
  </body>
</html>
